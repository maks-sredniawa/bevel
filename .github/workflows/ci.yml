name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browsers: chromium firefox webkit
          - os: macos-latest
            browsers: chromium firefox webkit
          - os: windows-latest
            browsers: chromium firefox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.browsers }}
      - run: python tests/browser/smoke_test.py ${{ matrix.browsers }}
